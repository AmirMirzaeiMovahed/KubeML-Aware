apiVersion: v1
kind: Pod
metadata:
  name: test-ai-workload
  labels:
    ml.scheduler/run-id: test-run-1
  annotations:
    ml.scheduler/run-id: test-run-1
    ml.scheduler/estimated-training-time: "300"
    ml.scheduler/loss-reduction-rate: "0.1"
    ml.scheduler/matrix-size: "1024"
    ml.scheduler/gradient-update-size: "256"
    ml.scheduler/checkpoint-interval: "100"
    ml.scheduler/model-partitions: "1"
spec:
  schedulerName: default-scheduler
  schedulingGates:
  - name: ml.scheduler/release
  containers:
  - name: test
    image: nginx
    resources:
      requests:
        memory: "64Mi"
        cpu: "100m"
      limits:
        memory: "128Mi"
        cpu: "200m"