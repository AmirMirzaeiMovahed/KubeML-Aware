name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Project implementation/k8s-ai-scheduler

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            Project implementation/k8s-ai-scheduler/requirements*.txt
            Project implementation/k8s-ai-scheduler/constraints.txt
      - name: Install locked dependencies
        run: python -m pip install -c constraints.txt -r requirements-dev.txt
      - name: Validate dependencies
        run: python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Compile
        run: python -m compileall -q scheduler workload k8s results sim experiments scripts
      - name: Test
        run: python -m pytest
      - name: Validate locked experiment plans
        run: |
          python -m experiments.run_cluster --plan-out experiments/locks/article-70.json
          python -m experiments.run_cluster --include-adaptive --plan-out experiments/locks/extended-90.json

  package-and-helm:
    name: Package and Helm
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            Project implementation/k8s-ai-scheduler/requirements*.txt
            Project implementation/k8s-ai-scheduler/constraints.txt
      - name: Set up Helm
        uses: Azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with:
          version: v4.2.0
      - name: Install locked dependencies
        run: python -m pip install -c constraints.txt -r requirements-dev.txt
      - name: Run manifest preflight
        shell: pwsh
        run: ./scripts/preflight.ps1 -Python python -SkipTests
      - name: Validate shell scripts
        shell: bash
        run: bash -n scripts/deploy.sh scripts/server-preflight.sh scripts/smoke-test.sh
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File): $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
      - name: Build release archives and checksums
        run: python scripts/build_release.py
      - name: Inspect and install wheel
        shell: bash
        run: |
          python -m zipfile --list dist/*.whl
          python -m venv "$RUNNER_TEMP/wheel-check"
          "$RUNNER_TEMP/wheel-check/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-check/bin/python" -c "import experiments, scheduler; from importlib.resources import files; root=files('experiments'); assert root.joinpath('locks/article-70.json').is_file(); assert root.joinpath('article_reference.yaml').is_file()"
      - name: Upload release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: k8s-ai-scheduler-release-candidate
          path: Project implementation/k8s-ai-scheduler/dist/
          if-no-files-found: error
