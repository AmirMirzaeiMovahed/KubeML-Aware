apiVersion: v1
kind: Pod
metadata:
  name: workload-8
  labels:
    ml.scheduler/run-id: run-large
  annotations:
    ml.scheduler/run-id: run-large
    ml.scheduler/estimated-training-time: "220"
    ml.scheduler/loss-reduction-rate: "0.18"
    ml.scheduler/matrix-size: "768"
    ml.scheduler/gradient-update-size: "192"
    ml.scheduler/checkpoint-interval: "60"
    ml.scheduler/model-partitions: "2"
spec:
  schedulerName: default-scheduler
  schedulingGates:
  - name: ml.scheduler/release
  containers:
  - name: train
    image: nginx
    resources:
      requests:
        memory: "384Mi"
        cpu: "400m"
      limits:
        memory: "768Mi"
        cpu: "1000m"