apiVersion: v1
kind: Pod
metadata:
  name: workload-7
  labels:
    ml.scheduler/run-id: run-large
  annotations:
    ml.scheduler/run-id: run-large
    ml.scheduler/estimated-training-time: "350"
    ml.scheduler/loss-reduction-rate: "0.08"
    ml.scheduler/matrix-size: "1536"
    ml.scheduler/gradient-update-size: "384"
    ml.scheduler/checkpoint-interval: "125"
    ml.scheduler/model-partitions: "3"
spec:
  schedulerName: default-scheduler
  schedulingGates:
  - name: ml.scheduler/release
  containers:
  - name: train
    image: nginx
    resources:
      requests:
        memory: "768Mi"
        cpu: "750m"
      limits:
        memory: "1536Mi"
        cpu: "1500m"