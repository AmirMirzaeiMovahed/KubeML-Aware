apiVersion: v1
kind: Pod
metadata:
  name: workload-3
  labels:
    ml.scheduler/run-id: run-small
  annotations:
    ml.scheduler/run-id: run-small
    ml.scheduler/estimated-training-time: "90"
    ml.scheduler/loss-reduction-rate: "0.4"
    ml.scheduler/matrix-size: "256"
    ml.scheduler/gradient-update-size: "64"
    ml.scheduler/checkpoint-interval: "15"
    ml.scheduler/model-partitions: "1"
spec:
  schedulerName: default-scheduler
  restartPolicy: Never
  schedulingGates:
  - name: ml.scheduler/release
  containers:
  - name: train
    image: ml-sim-job:local
    env:
    - name: JOB_ID
      value: "workload-3"
    - name: JOB_T
      value: "90"
    - name: JOB_R
      value: "0.4"
    - name: JOB_M
      value: "256"
    - name: JOB_G
      value: "64"
    - name: JOB_C
      value: "15"
    - name: JOB_P
      value: "1"
    resources:
      requests:
        memory: "128Mi"
        cpu: "200m"
      limits:
        memory: "256Mi"
        cpu: "500m"