apiVersion: v1
kind: Pod
metadata:
  name: workload-2
  labels:
    ml.scheduler/run-id: run-small
  annotations:
    ml.scheduler/run-id: run-small
    ml.scheduler/estimated-training-time: "120"
    ml.scheduler/loss-reduction-rate: "0.3"
    ml.scheduler/matrix-size: "512"
    ml.scheduler/gradient-update-size: "128"
    ml.scheduler/checkpoint-interval: "20"
    ml.scheduler/model-partitions: "1"
spec:
  schedulerName: default-scheduler
  schedulingGates:
  - name: ml.scheduler/release
  containers:
  - name: train
    image: nginx
    resources:
      requests:
        memory: "256Mi"
        cpu: "300m"
      limits:
        memory: "512Mi"
        cpu: "800m"