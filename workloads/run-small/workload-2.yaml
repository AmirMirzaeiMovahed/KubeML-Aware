apiVersion: v1
kind: Pod
metadata:
  name: workload-2
  labels:
    ml.scheduler/run-id: run-small
  annotations:
    ml.scheduler/run-id: run-small
    ml.scheduler/estimated-training-time: "120"
    ml.scheduler/loss-reduction-rate: "0.3"
    ml.scheduler/matrix-size: "512"
    ml.scheduler/gradient-update-size: "128"
    ml.scheduler/checkpoint-interval: "20"
    ml.scheduler/model-partitions: "1"
spec:
  schedulerName: default-scheduler
  restartPolicy: Never
  schedulingGates:
  - name: ml.scheduler/release
  containers:
  - name: train
    image: ml-sim-job:local
    env:
    - name: JOB_ID
      value: "workload-2"
    - name: JOB_T
      value: "120"
    - name: JOB_R
      value: "0.3"
    - name: JOB_M
      value: "512"
    - name: JOB_G
      value: "128"
    - name: JOB_C
      value: "20"
    - name: JOB_P
      value: "1"
    resources:
      requests:
        memory: "256Mi"
        cpu: "300m"
      limits:
        memory: "512Mi"
        cpu: "800m"