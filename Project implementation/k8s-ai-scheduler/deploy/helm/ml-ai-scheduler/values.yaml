# mode is either "production" (scheduling-gate controller) or "reproduction"
# (single-node manual-binding implementation matching the article).
mode: production
replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: ml-aware-scheduler
  tag: "0.3.0"
  # Prefer an immutable sha256 digest on a shared/production cluster.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

scheduler:
  name: default-scheduler
  gateName: ml.scheduler/release
  logLevel: INFO
  pacingMode: none
  fixedDelaySeconds: 0
  cpuThreshold: 0.85
  # Must exceed the observed Metrics API sample cadence with margin. The
  # matrix runner measures timestamp advancement before adaptive execution.
  maxWaitSeconds: 90
  metricsMaxAgeSeconds: 30
  # Training-only batch release. Missing/stale Metrics API data or projected
  # CPU above this threshold fails closed to the ranked admission path.
  fastPathEnabled: false
  fastPathCpuThreshold: 0.80
  adaptiveHysteresis: 0.05
  expectedCount: 0
  quietPeriodSeconds: 1.5
  burstTimeoutSeconds: 60
  pollIntervalSeconds: 0.5
  executionTimeoutSeconds: 120
  apiTimeoutSeconds: 10
  apiRetries: 4
  targetNode: ""
  # Set only on a single-node cluster to pace against that node's CPU metrics.
  # Empty keeps the safer cluster-wide production feedback.
  metricsNode: ""
  reverse: false
  resultsPath: "/results/schedule-{run_id}.json"
  extraArgs: []

experiment:
  runId: ""
  scenario: ""
  config: ""
  repetition: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true
  # Enables cluster-scoped read access to nodes.metrics.k8s.io independently
  # from the fallback pacing mode. Required by dynamic 90-run matrix Pods.
  nodeMetricsRead: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

health:
  port: 8080
  startup:
    periodSeconds: 2
    timeoutSeconds: 2
    failureThreshold: 30
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 2
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3

service:
  type: ClusterIP
  port: 8080
  # Keep health/metrics discoverable while readiness truthfully reports a
  # stranded or failed run.
  publishNotReadyAddresses: true
  annotations: {}

terminationGracePeriodSeconds: 30

persistence:
  # Results use bounded emptyDir by default. Enable a dynamically provisioned
  # PVC or set existingClaim when records must survive Pod replacement.
  enabled: false
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  annotations: {}

networkPolicy:
  enabled: true
  # Health and metrics are reachable from Pods in this namespace. Add
  # monitoring namespace labels below when a cross-namespace scraper is used.
  additionalIngressNamespaceSelectors: []
  egress:
    # In-cluster controllers use the Kubernetes service IP injected through
    # KUBERNETES_SERVICE_HOST, so DNS egress is not required. When known, set
    # apiServerCIDRs to restrict destinations as well as ports.
    enabled: true
    apiServerCIDRs: []
    apiServerPorts:
      - 443
      - 6443

podDisruptionBudget:
  enabled: false
  minAvailable: 1

monitoring:
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    additionalLabels: {}

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
