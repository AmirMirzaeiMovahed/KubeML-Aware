{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ml-ai-scheduler.fullname" . }}
  labels:
    {{- include "ml-ai-scheduler.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ml-ai-scheduler.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        {{- range .Values.networkPolicy.additionalIngressNamespaceSelectors }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.health.port }}
{{- end }}

