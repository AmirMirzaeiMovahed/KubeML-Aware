{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ml-ai-scheduler.fullname" . }}
  labels:
    {{- include "ml-ai-scheduler.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ml-ai-scheduler.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress.enabled }}
    - Egress
    {{- end }}
  ingress:
    - from:
        - podSelector: {}
        {{- range .Values.networkPolicy.additionalIngressNamespaceSelectors }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.health.port }}
  {{- if .Values.networkPolicy.egress.enabled }}
  egress:
    - ports:
        {{- range .Values.networkPolicy.egress.apiServerPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
      {{- with .Values.networkPolicy.egress.apiServerCIDRs }}
      to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      {{- end }}
  {{- end }}
{{- end }}

