{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ml-ai-scheduler.fullname" . }}
  labels:
    {{- include "ml-ai-scheduler.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  {{- if eq .Values.mode "reproduction" }}
  - apiGroups: [""]
    resources: ["bindings"]
    verbs: ["create"]
  {{- else }}
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ml-ai-scheduler.fullname" . }}
  labels:
    {{- include "ml-ai-scheduler.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ml-ai-scheduler.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ml-ai-scheduler.fullname" . }}
{{- if or (eq .Values.mode "reproduction") (eq .Values.scheduler.pacingMode "adaptive") .Values.scheduler.fastPathEnabled .Values.rbac.nodeMetricsRead }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ml-ai-scheduler.fullname" . }}
  labels:
    {{- include "ml-ai-scheduler.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  {{- if or .Values.rbac.nodeMetricsRead (eq .Values.scheduler.pacingMode "adaptive") .Values.scheduler.fastPathEnabled }}
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes"]
    verbs: ["get", "list"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ml-ai-scheduler.fullname" . }}
  labels:
    {{- include "ml-ai-scheduler.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ml-ai-scheduler.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ml-ai-scheduler.fullname" . }}
{{- end }}
{{- end }}
